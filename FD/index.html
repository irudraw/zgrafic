<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Video Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Facebook Video Downloader</h1>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <p class="text-muted">Ingresa la URL de un video o Reel de Facebook para ver y compartir</p>
                
                <div class="input-group mb-3">
                    <input type="text" id="videoUrl" class="form-control" placeholder="Ej: https://www.facebook.com/reel/1234567890">
                    <button class="btn btn-primary" id="findPoster">Buscar</button>
                </div>
                
                <div id="error" class="alert alert-danger d-none"></div>
                
                <div id="loading" class="d-none text-center my-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p>Procesando contenido...</p>
                </div>
                
                <div id="result" class="d-none">
                    <div class="row">
                        <div class="col-md-6">
                            <img id="posterImage" src="" class="img-fluid rounded shadow" alt="Miniatura del video">
                            <div class="quality-options mt-2" id="qualityOptions">
                                <button class="btn btn-sm btn-outline-secondary quality-btn" data-quality="sd">SD</button>
                                <button class="btn btn-sm btn-outline-primary quality-btn" data-quality="hd">HD</button>
                                <button class="btn btn-sm btn-outline-success quality-btn" data-quality="original">Original</button>
                            </div>
                            <div class="d-grid gap-2 mt-3">
                                <button id="downloadBtn" class="btn btn-success">Descargar Imagen</button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div id="videoContainer">
                                <div class="video-responsive">
                                    <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="embedSection" class="mt-4 p-3 bg-light rounded">
                        <h5>Compartir en tu web:</h5>
                        <div class="input-group mb-2">
                            <textarea id="embedCode" class="form-control" rows="3" readonly></textarea>
                            <button class="btn btn-primary" id="copyEmbed">Copiar</button>
                        </div>
                        <small class="text-muted">Pega este código en tu página web para incrustar el video</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
