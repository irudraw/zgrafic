<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda en línea</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dark-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

  <style>
    /* Slider */
    .slider-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-height: 400px;
      margin-bottom: 30px;
      border-radius: 12px;
    }
    .slider-wrapper {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }
    .slide {
      min-width: 100%;
      box-sizing: border-box;
      text-align: center;
      background: #202c33;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .slide img {
      max-height: 250px;
      object-fit: contain;
      margin: 15px auto;
    }
    .slide h3 {
      margin: 10px 0;
      color: #e9edef;
    }
    .slide .precio {
      color: #00a884;
      font-weight: bold;
    }
    .slider-controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
    }
    .slider-controls button {
      background: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      padding: 10px;
      cursor: pointer;
      border-radius: 50%;
    }
    .productos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Tienda en línea</h1>
      <!-- Buscador PC -->
      <div id="buscador-pc">
        <div id="buscador">
          <input type="text" id="buscar-producto" placeholder="Buscar productos...">
          <button id="btn-buscar"><i class="fas fa-search"></i></button>
        </div>
      </div>
      <div class="header-icons">
        <div id="mobile-search-icon" onclick="toggleMobileSearch()">
          <i class="fas fa-search"></i>
        </div>
        <div id="carrito-contador" onclick="abrirCarritoPopup()">
          <i class="fas fa-shopping-cart"></i>
          <span id="contador">0</span>
        </div>
      </div>
    </div>
  </header>

  <main role="main">
    <!-- SLIDER DE PRODUCTOS NUEVOS -->
    <section class="slider-container">
      <div class="slider-wrapper" id="slider"></div>
      <div class="slider-controls">
        <button id="prev">&#10094;</button>
        <button id="next">&#10095;</button>
      </div>
    </section>

    <!-- LISTADO DE PRODUCTOS ALEATORIOS -->
    <section id="productos" class="productos-grid"></section>
  </main>

  <!-- Popup Carrito -->
  <div id="carrito-popup" class="popup">
    <div class="popup-content">
      <span class="cerrar-popup" onclick="cerrarCarritoPopup()">&times;</span>
      <h2>Tu Carrito</h2>
      <div id="carrito-items"></div>
      <div id="carrito-total">Total: S/. 0.00</div>
      <button id="ver-carrito-completo">Ver Carrito Completo</button>
    </div>
  </div>

  <script>
    let productos = [];

    // Cargar productos JSON
    fetch("productos.json")
      .then(res => res.json())
      .then(data => {
        productos = data;

        // SLIDER con los 3 primeros como "nuevos"
        cargarSlider(productos.slice(0,3));

        // Productos aleatorios
        const aleatorios = productos.sort(() => Math.random() - 0.5);
        cargarProductos(aleatorios);
      });

    function cargarSlider(lista) {
      const slider = document.getElementById("slider");
      slider.innerHTML = "";
      lista.forEach(prod => {
        slider.innerHTML += `
          <div class="slide">
            <img src="${prod.imagen}" alt="${prod.nombre}">
            <h3>${prod.nombre}</h3>
            <p class="precio">S/. ${prod.precio}</p>
          </div>`;
      });
      iniciarSlider();
    }

    function iniciarSlider() {
      const slider = document.querySelector(".slider-wrapper");
      const slides = document.querySelectorAll(".slide");
      let index = 0;

      document.getElementById("next").onclick = () => {
        index = (index + 1) % slides.length;
        slider.style.transform = `translateX(-${index * 100}%)`;
      };

      document.getElementById("prev").onclick = () => {
        index = (index - 1 + slides.length) % slides.length;
        slider.style.transform = `translateX(-${index * 100}%)`;
      };
    }

    function cargarProductos(lista) {
      const contenedor = document.getElementById("productos");
      contenedor.innerHTML = "";
      lista.forEach(prod => {
        contenedor.innerHTML += `
          <div class="producto">
            <img src="${prod.imagen}" alt="${prod.nombre}">
            <h3>${prod.nombre}</h3>
            <p class="precio">S/. ${prod.precio}</p>
            <p class="descripcion">${prod.descripcion}</p>
          </div>`;
      });
    }
  </script>
</body>
</html>
