<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda en línea</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dark-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

  <style>
    /* --- SLIDER --- */
    .slider-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-height: 420px;
      margin-bottom: 40px;
      border-radius: 15px;
    }
    .slider-wrapper {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }
    .slide {
      min-width: 100%;
      text-align: center;
      background: #202c33;
    }
    .slide img {
      width: 100%;
      height: 420px;
      object-fit: cover;
    }
    .slider-controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
    }
    .slider-controls button {
      background: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      padding: 12px;
      cursor: pointer;
      border-radius: 50%;
      font-size: 20px;
    }

    /* --- PRODUCTOS ALEATORIOS --- */
    .productos-section {
      margin: 40px auto;
    }
    .productos-section h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #e9edef;
    }
    .productos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .producto {
      padding: 15px;
      border-radius: 10px;
      transition: transform 0.2s;
    }
    .producto:hover {
      transform: translateY(-5px);
    }
    .producto img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    /* --- SECCION DE DATOS --- */
    .datos-section {
      margin: 50px auto;
      padding: 30px;
      background-color: #202c33;
      border-radius: 15px;
      text-align: center;
    }
    .datos-section h2 {
      margin-bottom: 20px;
      color: #00a884;
    }
    .datos-section p {
      margin: 8px 0;
      color: #e9edef;
    }
    .datos-section i {
      margin-right: 8px;
      color: #00a884;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Tienda en línea</h1>
      <!-- Buscador -->
      <div id="buscador-pc">
        <div id="buscador">
          <input type="text" id="buscar-producto" placeholder="Buscar productos...">
          <button id="btn-buscar"><i class="fas fa-search"></i></button>
        </div>
      </div>
      <div class="header-icons">
        <div id="carrito-contador">
          <i class="fas fa-shopping-cart"></i>
          <span id="contador">0</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- SLIDER DE IMÁGENES PERSONALIZADAS -->
    <section class="slider-container">
      <div class="slider-wrapper" id="slider">
        <div class="slide"><img src="banner/banner1.jpg" alt="Promo 1"></div>
        <div class="slide"><img src="banner/banner2.jpg" alt="Promo 2"></div>
        <div class="slide"><img src="banner/banner3.jpg" alt="Promo 3"></div>
      </div>
      <div class="slider-controls">
        <button id="prev">&#10094;</button>
        <button id="next">&#10095;</button>
      </div>
    </section>

    <!-- PRODUCTOS ALEATORIOS -->
    <section class="productos-section">
      <h2>Productos destacados</h2>
      <div id="productos" class="productos-grid"></div>
    </section>

    <!-- SECCIÓN DE DATOS -->
    <section class="datos-section">
      <h2>Contáctanos</h2>
      <p><i class="fas fa-map-marker-alt"></i> Dirección: Av. Siempre Viva 123 - Lima</p>
      <p><i class="fas fa-phone"></i> WhatsApp: +51 987 654 321</p>
      <p><i class="fas fa-envelope"></i> Email: contacto@mitienda.com</p>
      <p><i class="fas fa-clock"></i> Horario: Lunes a Sábado - 9am a 7pm</p>
    </section>
  </main>

  <script>
    // --- SLIDER ---
    function iniciarSlider() {
      const slider = document.querySelector(".slider-wrapper");
      const slides = document.querySelectorAll(".slide");
      let index = 0;

      document.getElementById("next").onclick = () => {
        index = (index + 1) % slides.length;
        slider.style.transform = `translateX(-${index * 100}%)`;
      };

      document.getElementById("prev").onclick = () => {
        index = (index - 1 + slides.length) % slides.length;
        slider.style.transform = `translateX(-${index * 100}%)`;
      };

      // Auto-play
      setInterval(() => {
        index = (index + 1) % slides.length;
        slider.style.transform = `translateX(-${index * 100}%)`;
      }, 5000);
    }
    iniciarSlider();

    // --- PRODUCTOS ALEATORIOS ---
    fetch("productos.json")
      .then(res => res.json())
      .then(data => {
        const aleatorios = data.sort(() => Math.random() - 0.5).slice(0, 6);
        cargarProductos(aleatorios);
      });

    function cargarProductos(lista) {
      const contenedor = document.getElementById("productos");
      contenedor.innerHTML = "";
      lista.forEach(prod => {
        contenedor.innerHTML += `
          <div class="producto">
            <img src="${prod.imagen}" alt="${prod.nombre}">
            <h3>${prod.nombre}</h3>
            <p class="precio">S/. ${prod.precio}</p>
            <p class="descripcion">${prod.descripcion}</p>
          </div>`;
      });
    }
  </script>
</body>
</html>
