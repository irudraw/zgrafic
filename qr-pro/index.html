<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QR Reader PRO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>QR Reader PRO</h1>
      <div class="header-actions">
        <button id="themeToggle" title="Toggle theme" class="action-icon"><i data-lucide="moon"></i></button>
      </div>
    </header>

    <main class="app-main">
      <section class="left-panel">
        <div id="dropZone" class="drop-zone">
          <input id="fileInput" type="file" accept="image/*" hidden>
          <div class="drop-instructions">
            Arrastra una imagen QR aquí o haz click para seleccionar
          </div>
        </div>

        <textarea id="textInput" placeholder="Resultado del QR" readonly></textarea>

        <div class="controls">
          <button id="copyBtn" class="primary">Copiar resultado</button>
          <button id="downloadBtn" style="display:none;">Descargar SVG</button>
        </div>

        <div id="qrOutput" class="qr-output"></div>
      </section>

      <aside class="right-panel">
        <div id="historyContainer">
          <div id="historyHeader">
            <h3>Historial</h3>
            <input id="searchInput" placeholder="Buscar...">
          </div>
          <ul id="historyList"></ul>
          <div id="pagination">
            <button id="prevPage">Anterior</button>
            <span id="currentPage">1 / 1</span>
            <button id="nextPage">Siguiente</button>
          </div>
        </div>
      </aside>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- CDN libs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
