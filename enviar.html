<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Archivos a WhatsApp</title>
</head>
<body>
    <h1>Enviar Archivos a WhatsApp</h1>
    <form id="fileForm">
        <input type="file" id="fileInput" accept="image/*,video/*,application/pdf">
        <button type="button" onclick="sendToWhatsApp()">Enviar</button>
    </form>

    <script>
        function sendToWhatsApp() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert('Por favor, selecciona un archivo.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const fileData = event.target.result;
                const encodedFile = encodeURIComponent(fileData);
                const phoneNumber = '+51955486170';
                const whatsappUrl = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodedFile}`;
                window.open(whatsappUrl, '_blank');
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
