<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Banner</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    /*background-color: #f4f4f4;*/
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .calculator {
    background-color: var(--secondary-bg);
    background-color: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    width: 85%;
    max-width: 400px;

  }
  .input-group {
    margin-bottom: 20px;

display: flex;
width: 100%;
justify-content: center;
  }
  .input-number {
    width: calc(40% - 10px);
    padding: 10px;
    margin-right: 20px;
    border: none;
    border-bottom: 2px solid #9e9e9e;
    font-size: 18px;
    outline: none;
  }
  .input-number:last-child {
    margin-right: 0;
  }
  .button {
    width: calc(50% - 10px);
    padding: 10px;
    border: none;
    background-color: #007bff;
    color: white;
    font-size: 18px;
    border-radius: 5px;
    cursor: pointer;
    outline: none;

display: flex;
width: 100%;
justify-content: center;
  }
  .button:hover {
    background-color: #0056b3;
  }

  .label-result {
    display: block;
    margin-top: 10px;
    font-size: 20px;
    color: #333;

display: flex;
width: 100%;
justify-content: center;

  }


/* Estilo para alinear los botones de radio horizontalmente */
#seleccion-form {
  display: flex;
}
#seleccion-form label {
  margin-right: 10px; /* Espacio entre el botón y la etiqueta */
}


.form{
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  
}

/* @media print {
    #vendedor-info {
      display: block;
    }
  }
  @media screen {
    #vendedor-info {
      display: none;
    }
  }
*/
</style>

<script>
// Función para obtener el valor del parámetro GET por su nombre
function obtenerParametroGET(nombre) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(nombre);
}

// Función para establecer el botón de radio seleccionado al cargar la página
function establecerSeleccion() {
  const tipo = obtenerParametroGET('tipo');
  const seleccionGuardada = localStorage.getItem('ultimaSeleccionBanner'); // Recuperar la selección guardada

  if (tipo) {
    document.getElementById(tipo).checked = true;
    localStorage.setItem('ultimaSeleccionBanner', tipo); // Guardar la selección actual
  } else if (seleccionGuardada) {
    document.getElementById(seleccionGuardada).checked = true; // Usar la selección guardada
  }

  // Obtener el vendedor del parámetro GET y mostrarlo en el elemento para impresión
  const cliente = obtenerParametroGET('cliente');
  if (cliente) {
    const vendedorInfo = document.getElementById('vendedor-info');
    vendedorInfo.textContent = `Calculadora: ${cliente}`;
  }
}

// Función para manejar la selección y redirigir con parámetros GET
function seleccionarOpcion(tipo) {
  const cliente = obtenerParametroGET('cliente') || ''; // Mantener el vendedor si ya existe
  localStorage.setItem('ultimaSeleccionBanner', tipo); // Guardar la selección en localStorage
  window.location.href = `${window.location.pathname}?tipo=${tipo}&cliente=${cliente}`;
}

// Añadir el evento de carga para establecer la selección
window.onload = establecerSeleccion;
</script>

</head>
<div class="top-buttons">
        <a href="#" class="btn" data-page="banner"><i class="fas fa-image"></i><span>Banner</span></a>
        <a href="#" class="btn" data-page="vinil"><i class="fas fa-record-vinyl"></i><span>Vinil</span></a>
    </div>

    <main>
        <div id="content-container">
            <div id="content"></div>
        </div>
    </main>

    <div class="bottom-buttons">
        <a href="#" class="btn" data-cliente="Cliente"><i class="fas fa-user"></i><span>Clientes</span></a>
        <a href="#" class="btn" data-cliente="Diseñador"><i class="fas fa-paint-brush"></i><span>Diseñadores</span></a>
        <a href="#" class="btn" data-cliente="Vendedor"><i class="fas fa-store"></i><span>Vendedores</span></a>
        <a href="#" class="btn" data-cliente="Casero"><i class="fas fa-ice-cream"></i><span>Helados</span></a>
    </div>

    <script>
        $(document).ready(function() {
            function loadContent(page) {
                $.get(page + '.html', function(data) {
                    $('#content').html(data);
                    applyUrlParams();
                });
            }

            function applyUrlParams() {
                const urlParams = new URLSearchParams(window.location.search);
                const tipo = urlParams.get('tipo');
                const cliente = urlParams.get('cliente');

                if (tipo) {
                    $('input[value="' + tipo + '"]').prop('checked', true);
                }

                if (cliente) {
                    $('#vendedor-info').text(cliente);
                }
            }

            $('[data-page]').click(function(e) {
                e.preventDefault();
                const page = $(this).data('page');
                loadContent(page);
            });

            $('.bottom-buttons .btn').click(function(e) {
                e.preventDefault();
                const cliente = $(this).data('cliente');
                const urlParams = new URLSearchParams(window.location.search);
                const tipo = urlParams.get('tipo') || 'grueso'; // Mantener el tipo actual o usar 'grueso' por defecto
                window.history.pushState({}, '', `?tipo=${tipo}&cliente=${cliente}`);
                applyUrlParams();
            });

            // Cargar contenido inicial basado en la URL o por defecto 'banner'
            const initialPage = new URLSearchParams(window.location.search).get('page') || 'banner';
            loadContent(initialPage);
        });
    </script>
</body>
</html>
