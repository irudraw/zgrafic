<!DOCTYPE html>

<title>Calculadora Banner</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    /*background-color: #f4f4f4;*/
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .calculator {
    background-color: var(--secondary-bg);
    background-color: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    width: 85%;
    max-width: 400px;

  }
  .input-group {
    margin-bottom: 20px;

display: flex;
width: 100%;
justify-content: center;
  }
  .input-number {
    width: calc(40% - 10px);
    padding: 10px;
    margin-right: 20px;
    border: none;
    border-bottom: 2px solid #9e9e9e;
    font-size: 18px;
    outline: none;
  }
  .input-number:last-child {
    margin-right: 0;
  }
  .button {
    width: calc(50% - 10px);
    padding: 10px;
    border: none;
    background-color: #007bff;
    color: white;
    font-size: 18px;
    border-radius: 5px;
    cursor: pointer;
    outline: none;

display: flex;
width: 100%;
justify-content: center;
  }
  .button:hover {
    background-color: #0056b3;
  }

  .label-result {
    display: block;
    margin-top: 10px;
    font-size: 20px;
    color: #333;

display: flex;
width: 100%;
justify-content: center;

  }


/* Estilo para alinear los botones de radio horizontalmente */
#seleccion-form {
  display: flex;
}
#seleccion-form label {
  margin-right: 10px; /* Espacio entre el botón y la etiqueta */
}


.form{
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  
}

*/
</style>

<script>
// Función para obtener el valor del parámetro GET por su nombre
function obtenerParametroGET(nombre) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(nombre);
}

// Función para establecer el botón de radio seleccionado al cargar la página
function establecerSeleccion() {
  const tipo = obtenerParametroGET('tipo');
  const seleccionGuardada = localStorage.getItem('ultimaSeleccionBanner'); // Recuperar la selección guardada

  if (tipo) {
    document.getElementById(tipo).checked = true;
    localStorage.setItem('ultimaSeleccionBanner', tipo); // Guardar la selección actual
  } else if (seleccionGuardada) {
    document.getElementById(seleccionGuardada).checked = true; // Usar la selección guardada
  }

  // Obtener el vendedor del parámetro GET y mostrarlo en el elemento para impresión
  const cliente = obtenerParametroGET('cliente');
  if (cliente) {
    const vendedorInfo = document.getElementById('vendedor-info');
    vendedorInfo.textContent = `Calculadora: ${cliente}`;
  }
}

// Función para manejar la selección y redirigir con parámetros GET
function seleccionarOpcion(tipo) {
  const cliente = obtenerParametroGET('cliente') || ''; // Mantener el vendedor si ya existe
  localStorage.setItem('ultimaSeleccionBanner', tipo); // Guardar la selección en localStorage
  window.location.href = `${window.location.pathname}?tipo=${tipo}&cliente=${cliente}`;
}

// Añadir el evento de carga para establecer la selección
window.onload = establecerSeleccion;
</script>

</head>
<body>

<div class="calculator">
<div id="vendedor-info" class="label-result"></div><br>

<form id="seleccion-form" class="form">
  <input type="radio" id="grueso" name="opcion" value="grueso" onclick="seleccionarOpcion(this.value)">
  <label for="grueso">Grueso</label><br>
  
  <input type="radio" id="delgado" name="opcion" value="delgado" onclick="seleccionarOpcion(this.value)" >
  <label for="delgado">Delgado</label><br>
</form>
