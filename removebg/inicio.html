<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quitar fondo de imagen (por color)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      background: white;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #1a1a1a; }
    .input-area { margin-bottom: 1.5rem; }
    input[type="file"] { display: none; }
    .custom-file-label {
      display: inline-block;
      background: #4f46e5;
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .custom-file-label:hover { background: #4338ca; }
    .preview-box {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .preview-item {
      flex: 1 1 250px;
      border: 2px dashed #ddd;
      border-radius: 1rem;
      padding: 1rem;
      background: #fafafa;
    }
    .preview-item p { font-size: 0.9rem; color: #555; margin-bottom: 0.5rem; font-weight: 500; }
    .preview-item img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 0.75rem;
      object-fit: contain;
    }
    canvas { display: none; }
    .controls {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    .color-picker {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .tolerance-slider {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    button {
      padding: 0.7rem 1.8rem;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      background: #e5e7eb;
      color: #1f2937;
    }
    button.primary { background: #10b981; color: white; }
    button.primary:hover { background: #059669; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 1rem; font-size: 0.9rem; color: #4b5563; min-height: 1.5em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧹 Quitar fondo (chroma key)</h1>
    <div class="input-area">
      <label for="fileInput" class="custom-file-label">📁 Seleccionar imagen</label>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="preview-box">
      <div class="preview-item">
        <p>Original</p>
        <img id="originalImg" alt="Vista previa original" />
      </div>
      <div class="preview-item">
        <p>Resultado</p>
        <img id="resultImg" alt="Resultado" />
      </div>
    </div>

    <div class="controls" id="controls" style="display: none;">
      <div class="color-picker">
        <label>Color de fondo:</label>
        <input type="color" id="bgColor" value="#ffffff" />
      </div>
      <div class="tolerance-slider">
        <label>Tolerancia:</label>
        <input type="range" id="tolerance" min="0" max="100" value="30" />
        <span id="toleranceValue">30</span>%
      </div>
      <button id="applyBtn" class="primary">Aplicar</button>
    </div>

    <button id="downloadBtn" disabled style="margin-top: 1rem;">⬇️ Descargar PNG</button>
    <div class="status" id="statusMessage">Selecciona una imagen para empezar</div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const fileInput = document.getElementById('fileInput');
    const originalImg = document.getElementById('originalImg');
    const resultImg = document.getElementById('resultImg');
    const controls = document.getElementById('controls');
    const bgColorInput = document.getElementById('bgColor');
    const toleranceInput = document.getElementById('tolerance');
    const toleranceValue = document.getElementById('toleranceValue');
    const applyBtn = document.getElementById('applyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusEl = document.getElementById('statusMessage');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let loadedImage = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    toleranceInput.addEventListener('input', () => {
      toleranceValue.textContent = toleranceInput.value;
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(ev) {
        originalImg.src = ev.target.result;
        originalImg.style.display = 'block';
        originalImg.onload = function() {
          loadedImage = originalImg;
          canvas.width = loadedImage.naturalWidth;
          canvas.height = loadedImage.naturalHeight;
          ctx.drawImage(loadedImage, 0, 0);
          controls.style.display = 'flex';
          downloadBtn.disabled = true;
          resultImg.style.display = 'none';
          setStatus('Haz clic en la imagen original para elegir el color de fondo a eliminar');
        };
      };
      reader.readAsDataURL(file);
    });

    // Pick color from original image on click
    originalImg.addEventListener('click', (e) => {
      if (!loadedImage) return;
      const rect = originalImg.getBoundingClientRect();
      const scaleX = loadedImage.naturalWidth / rect.width;
      const scaleY = loadedImage.naturalHeight / rect.height;
      const x = Math.floor((e.clientX - rect.left) * scaleX);
      const y = Math.floor((e.clientY - rect.top) * scaleY);

      const pixel = ctx.getImageData(x, y, 1, 1).data;
      const hex = '#' + [pixel[0], pixel[1], pixel[2]].map(v => v.toString(16).padStart(2, '0')).join('');
      bgColorInput.value = hex;
      setStatus('Color de fondo: ' + hex + '. Ajusta la tolerancia y pulsa Aplicar.');
    });

    applyBtn.addEventListener('click', () => {
      if (!loadedImage) return;
      const hex = bgColorInput.value;
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      const tolerance = parseInt(toleranceInput.value, 10);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const dr = data[i] - r;
        const dg = data[i+1] - g;
        const db = data[i+2] - b;
        const dist = Math.sqrt(dr*dr + dg*dg + db*db);
        if (dist <= tolerance) {
          data[i+3] = 0; // transparente
        }
      }

      ctx.putImageData(imageData, 0, 0);
      resultImg.src = canvas.toDataURL('image/png');
      resultImg.style.display = 'block';
      downloadBtn.disabled = false;
      setStatus('¡Fondo eliminado! Puedes descargar la imagen.');
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'sin_fondo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
