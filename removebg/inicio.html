<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quitar fondo de imagen con IA (WebGL)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      background: white;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #1a1a1a; }
    .input-area { margin-bottom: 1.5rem; }
    input[type="file"] { display: none; }
    .custom-file-label {
      display: inline-block;
      background: #4f46e5;
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .custom-file-label:hover { background: #4338ca; }
    .preview-box {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .preview-item {
      flex: 1 1 250px;
      border: 2px dashed #ddd;
      border-radius: 1rem;
      padding: 1rem;
      background: #fafafa;
    }
    .preview-item p { font-size: 0.9rem; color: #555; margin-bottom: 0.5rem; font-weight: 500; }
    .preview-item img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 0.75rem;
      object-fit: contain;
      display: none;
    }
    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 0.7rem 1.8rem;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      background: #e5e7eb;
      color: #1f2937;
    }
    button.primary { background: #10b981; color: white; }
    button.primary:hover { background: #059669; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 1rem; font-size: 0.9rem; color: #4b5563; min-height: 1.5em; }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #d1d5db;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Quitar fondo con IA (sin SIMD)</h1>
    <div class="input-area">
      <label for="fileInput" class="custom-file-label">📁 Seleccionar imagen</label>
      <input type="file" id="fileInput" accept="image/*" />
    </div>

    <div class="preview-box">
      <div class="preview-item" id="originalBox">
        <p>Original</p>
        <img id="originalImg" alt="Vista previa original" />
      </div>
      <div class="preview-item" id="resultBox">
        <p>Sin fondo</p>
        <img id="resultImg" alt="Resultado" />
      </div>
    </div>

    <div class="buttons">
      <button id="removeBtn" class="primary" disabled>✨ Quitar fondo</button>
      <button id="downloadBtn" disabled>⬇️ Descargar</button>
    </div>
    <div class="status" id="statusMessage"></div>
  </div>

  <!-- Cargar ONNX Runtime Web desde CDN (sin SIMD) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/ort.webgl.min.js"></script>
  <!-- También necesitamos un helper para manipular imágenes -->
  <script src="https://cdn.jsdelivr.net/npm/jimp@0.22.12/browser/lib/jimp.min.js"></script>

  <script>
    (async function() {
      const fileInput = document.getElementById('fileInput');
      const originalImg = document.getElementById('originalImg');
      const resultImg = document.getElementById('resultImg');
      const removeBtn = document.getElementById('removeBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const statusEl = document.getElementById('statusMessage');

      let originalImageElement = null;
      let resultBlob = null;
      let ortSession = null;

      // Cargar el modelo U²-Net (ONNX) desde un repositorio público
      async function loadModel() {
        setStatus('Cargando modelo de IA... (esto puede tardar unos segundos)', true);
        try {
          // Usamos el modelo U²-Net convertido a ONNX disponible en HuggingFace
          const modelUrl = 'https://huggingface.co/Xenova/u2net/resolve/main/model.onnx';
          ortSession = await ort.InferenceSession.create(modelUrl, {
            executionProviders: ['webgl'], // Forzamos WebGL para evitar SIMD
          });
          setStatus('Modelo cargado. Selecciona una imagen.');
        } catch (err) {
          console.error(err);
          setStatus('❌ Error al cargar el modelo. Recarga la página.');
        }
      }

      function setStatus(text, isLoading = false) {
        statusEl.innerHTML = isLoading
          ? `<span class="loader"></span> ${text}`
          : text;
      }

      function reset() {
        resultBlob = null;
        resultImg.src = '';
        resultImg.style.display = 'none';
        downloadBtn.disabled = true;
        removeBtn.disabled = true;
      }

      // Cuando se selecciona una imagen
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) {
          reset();
          originalImg.src = '';
          originalImg.style.display = 'none';
          setStatus('Selecciona una imagen para empezar');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(ev) {
          originalImg.src = ev.target.result;
          originalImg.style.display = 'block';
          originalImg.onload = function() {
            originalImageElement = originalImg;
            reset();
            removeBtn.disabled = false;
            setStatus('Listo para quitar el fondo');
          };
        };
        reader.readAsDataURL(file);
      });

      // Procesar imagen con el modelo
      removeBtn.addEventListener('click', async () => {
        if (!originalImageElement || !ortSession) return;
        removeBtn.disabled = true;
        setStatus('Procesando imagen...', true);
        downloadBtn.disabled = true;

        try {
          // 1. Convertir la imagen a un tensor de entrada (320x320, normalizado)
          const inputTensor = await imageToTensor(originalImageElement);
          
          // 2. Ejecutar inferencia
          const feeds = { 'input': inputTensor };
          const results = await ortSession.run(feeds);
          const output = results['output']; // tensor (1,1,320,320)

          // 3. Convertir la máscara en imagen final con fondo transparente
          const blob = await applyMask(originalImageElement, output);
          resultBlob = blob;
          const url = URL.createObjectURL(blob);
          resultImg.src = url;
          resultImg.style.display = 'block';
          downloadBtn.disabled = false;
          setStatus('¡Fondo eliminado con éxito!');
        } catch (err) {
          console.error(err);
          setStatus('❌ Error al procesar la imagen. Intenta con otra.');
        } finally {
          removeBtn.disabled = false;
        }
      });

      // Descargar resultado
      downloadBtn.addEventListener('click', () => {
        if (!resultBlob) return;
        const url = URL.createObjectURL(resultBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sin_fondo.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setStatus('Descarga iniciada ✅');
      });

      // Funciones auxiliares
      async function imageToTensor(img) {
        // Redimensionar a 320x320 y normalizar (modelo U²-Net)
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 320;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 320, 320);
        const imageData = ctx.getImageData(0, 0, 320, 320);
        const { data } = imageData;
        
        // Convertir a Float32Array (normalizado: 0..1, formato NCHW)
        const float32Data = new Float32Array(1 * 3 * 320 * 320);
        for (let i = 0; i < data.length; i += 4) {
          const pixelIndex = i / 4;
          float32Data[pixelIndex] = data[i] / 255;           // R
          float32Data[320*320 + pixelIndex] = data[i+1] / 255; // G
          float32Data[2*320*320 + pixelIndex] = data[i+2] / 255; // B
        }
        return new ort.Tensor('float32', float32Data, [1, 3, 320, 320]);
      }

      async function applyMask(originalImg, maskTensor) {
        // maskTensor: [1, 1, 320, 320] valores 0..1
        const maskData = maskTensor.data; // Float32Array
        const width = 320, height = 320;

        // Dibujar la imagen original en un canvas de 320x320
        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = width;
        srcCanvas.height = height;
        const srcCtx = srcCanvas.getContext('2d');
        srcCtx.drawImage(originalImg, 0, 0, width, height);
        const srcImageData = srcCtx.getImageData(0, 0, width, height);
        const srcData = srcImageData.data;

        // Crear canvas de salida
        const outCanvas = document.createElement('canvas');
        outCanvas.width = width;
        outCanvas.height = height;
        const outCtx = outCanvas.getContext('2d');
        const outImageData = outCtx.createImageData(width, height);
        const outData = outImageData.data;

        for (let i = 0; i < maskData.length; i++) {
          const alpha = Math.round(maskData[i] * 255); // 0..255
          outData[i*4] = srcData[i*4];       // R
          outData[i*4+1] = srcData[i*4+1];   // G
          outData[i*4+2] = srcData[i*4+2];   // B
          outData[i*4+3] = alpha;            // A (máscara)
        }
        outCtx.putImageData(outImageData, 0, 0);

        // Convertir canvas a blob PNG
        return new Promise(resolve => {
          outCanvas.toBlob(blob => resolve(blob), 'image/png');
        });
      }

      // Arrancar
      reset();
      setStatus('Cargando modelo...');
      await loadModel();
    })();
  </script>
</body>
</html>
