<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliminar Fondo – BEN2 (Transformers.js)</title>

  <!-- Import Map con la versión más reciente de Transformers.js -->
  <script type="importmap">
  {
    "imports": {
      "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@latest/dist/transformers.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 1000px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: #1e293b;
      font-weight: 700;
      font-size: 2rem;
    }
    .sub {
      color: #64748b;
      margin-bottom: 25px;
    }
    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 40px 20px;
      margin: 20px 0;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      background: #f8fafc;
    }
    .drop-zone:hover {
      background: #f1f5f9;
      border-color: #3b82f6;
    }
    .drop-zone.dragover {
      background: #dbeafe;
      border-color: #2563eb;
    }
    .drop-zone p {
      margin: 0;
      font-size: 1.1rem;
      color: #334155;
    }
    .drop-zone small {
      color: #94a3b8;
    }
    .drop-zone input {
      display: none;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .controls button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .controls button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .controls button:hover:not(:disabled) {
      background: #2563eb;
    }
    .controls .download {
      background: #22c55e;
    }
    .controls .download:hover:not(:disabled) {
      background: #16a34a;
    }
    .status {
      margin: 15px 0;
      font-weight: 500;
      color: #1e293b;
      min-height: 2em;
    }
    .status .loader {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 4px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .canvas-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    .canvas-box {
      flex: 1 1 280px;
      background: repeating-conic-gradient(#e2e8f0 0% 25%, #ffffff 0% 50%) 0 0 / 20px 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .canvas-box canvas {
      max-width: 100%;
      max-height: 500px;
      display: block;
    }
    .info {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #64748b;
    }
    .info a {
      color: #3b82f6;
      text-decoration: none;
    }
    .info a:hover {
      text-decoration: underline;
    }
    .footer {
      margin-top: 25px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🧹 Eliminar Fondo</h1>
  <p class="sub">Modelo <strong>BEN2‑ONNX</strong> · 100% local · sin subir imágenes</p>

  <div class="drop-zone" id="dropZone">
    <p>📤 Arrastra una imagen o haz clic para seleccionar</p>
    <small>JPG, PNG, WebP</small>
    <input type="file" id="fileInput" accept="image/*" />
  </div>

  <div class="controls">
    <button id="processBtn" disabled>🚀 Eliminar fondo</button>
    <button id="downloadBtn" class="download" disabled>⬇️ Descargar PNG</button>
  </div>

  <div id="status" class="status">⏳ Cargando modelo…</div>

  <div class="canvas-wrapper">
    <div class="canvas-box">
      <canvas id="originalCanvas"></canvas>
    </div>
    <div class="canvas-box">
      <canvas id="resultCanvas"></canvas>
    </div>
  </div>

  <div class="info">
    ⚡ Usa <a href="https://huggingface.co/onnx-community/BEN2-ONNX" target="_blank">BEN2‑ONNX</a> vía <a href="https://huggingface.co/docs/transformers.js" target="_blank">Transformers.js</a>
  </div>
  <div class="footer">Hecho para GitHub Pages · Código abierto</div>
</div>

<script type="module">
  // ----- Importar Transformers.js -----
  import { pipeline } from '@huggingface/transformers';

  // ----- Referencias DOM -----
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const processBtn = document.getElementById('processBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusDiv = document.getElementById('status');
  const originalCanvas = document.getElementById('originalCanvas');
  const resultCanvas = document.getElementById('resultCanvas');
  const ctxOrig = originalCanvas.getContext('2d');
  const ctxRes = resultCanvas.getContext('2d');

  // ----- Estado -----
  let loadedImage = null;          // HTMLImageElement
  let imageUrl = null;            // URL para el pipeline
  let segmenter = null;           // pipeline cargado
  let isModelReady = false;
  let currentResultBlob = null;   // Blob de la imagen resultante (para descarga)

  // ----- Función para actualizar estado -----
  function setStatus(msg, isLoading = false) {
    if (isLoading) {
      statusDiv.innerHTML = `<span class="loader"></span> ${msg}`;
    } else {
      statusDiv.textContent = msg;
    }
  }

  // ----- Cargar el modelo (solo una vez) -----
  async function loadModel() {
    try {
      setStatus('📦 Descargando modelo BEN2-ONNX… (puede tardar 1-2 min la primera vez)', true);
      segmenter = await pipeline('background-removal', 'onnx-community/BEN2-ONNX');
      isModelReady = true;
      setStatus('✅ Modelo listo. Sube una imagen.');
      if (loadedImage) processBtn.disabled = false;
    } catch (err) {
      console.error(err);
      setStatus('❌ Error al cargar el modelo. Revisa consola.');
    }
  }

  loadModel();

  // ----- Cargar imagen desde archivo -----
  function loadImageFromFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('Por favor, selecciona una imagen (JPG, PNG, WebP).');
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        // Liberar URL anterior si existía
        if (imageUrl) URL.revokeObjectURL(imageUrl);
        imageUrl = URL.createObjectURL(file);

        // Mostrar en canvas original
        originalCanvas.width = img.width;
        originalCanvas.height = img.height;
        ctxOrig.drawImage(img, 0, 0);

        // Limpiar resultado
        resultCanvas.width = img.width;
        resultCanvas.height = img.height;
        ctxRes.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
        currentResultBlob = null;
        downloadBtn.disabled = true;

        setStatus('📷 Imagen cargada. Haz clic en "Eliminar fondo".');
        if (isModelReady) processBtn.disabled = false;
        else processBtn.disabled = true;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ----- Procesar imagen (eliminar fondo) -----
  async function processImage() {
    if (!loadedImage || !imageUrl) {
      setStatus('⚠️ Primero carga una imagen.');
      return;
    }
    if (!isModelReady || !segmenter) {
      setStatus('⏳ Modelo no está listo aún. Espera…');
      return;
    }

    processBtn.disabled = true;
    downloadBtn.disabled = true;
    setStatus('🔄 Procesando… (puede tomar unos segundos)', true);

    try {
      // Ejecutar el pipeline
      const results = await segmenter([imageUrl]);
      const resultImg = results[0];

      // Obtener el blob de la imagen resultante (con transparencia)
      const blob = await resultImg.toBlob();
      currentResultBlob = blob;

      // Crear una URL para mostrar en el canvas
      const url = URL.createObjectURL(blob);

      // Cargar la imagen en un elemento Image para dibujarla
      const img = new Image();
      img.onload = () => {
        // Ajustar canvas de resultado al tamaño de la imagen (debe ser igual a la original)
        resultCanvas.width = img.width;
        resultCanvas.height = img.height;
        ctxRes.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
        ctxRes.drawImage(img, 0, 0);
        setStatus('✅ Fondo eliminado correctamente');
        downloadBtn.disabled = false;
        processBtn.disabled = false;
        URL.revokeObjectURL(url);
      };
      img.onerror = (err) => {
        console.error(err);
        setStatus('❌ Error al mostrar la imagen resultante.');
        processBtn.disabled = false;
      };
      img.src = url;

    } catch (err) {
      console.error(err);
      setStatus('❌ Error al procesar. Revisa consola.');
      processBtn.disabled = false;
      downloadBtn.disabled = true;
    }
  }

  // ----- Descargar resultado (usa el blob guardado) -----
  function downloadResult() {
    if (!currentResultBlob) {
      alert('No hay resultado para descargar.');
      return;
    }
    const link = document.createElement('a');
    link.download = 'sin_fondo.png';
    link.href = URL.createObjectURL(currentResultBlob);
    link.click();
    URL.revokeObjectURL(link.href);
  }

  // ----- EVENTOS UI -----

  // Clic en la zona de arrastre
  dropZone.addEventListener('click', (e) => {
    if (e.target.tagName !== 'INPUT') fileInput.click();
  });

  // Arrastrar y soltar
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
  });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) loadImageFromFile(files[0]);
  });

  // Input file
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      loadImageFromFile(e.target.files[0]);
    }
    fileInput.value = '';
  });

  // Botones
  processBtn.addEventListener('click', processImage);
  downloadBtn.addEventListener('click', downloadResult);
</script>
</body>
</html>
