<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio Pro - Fondo + Mejora de Calidad</title>

  <!-- Import Map para Transformers.js -->
  <script type="importmap">
  {
    "imports": {
      "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.4.0/dist/transformers.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 30px;
      max-width: 1200px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }
    h1 {
      margin-top: 0;
      color: #0f172a;
      font-weight: 800;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #64748b;
    }
    .badge {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin: 0 4px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin: 20px 0;
    }
    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .drop-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 40px 20px;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8fafc;
      text-align: center;
    }
    .drop-zone:hover, .drop-zone.dragover {
      background: #eff6ff;
      border-color: #3b82f6;
    }
    .drop-zone p { margin: 0; color: #334155; }
    .drop-zone small { color: #94a3b8; }
    .drop-zone input { display: none; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 15px 0;
    }
    .controls button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .controls button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .controls button:hover:not(:disabled) { background: #2563eb; }
    .controls .btn-success { background: #22c55e; }
    .controls .btn-success:hover:not(:disabled) { background: #16a34a; }
    .controls .btn-purple { background: #8b5cf6; }
    .controls .btn-purple:hover:not(:disabled) { background: #7c3aed; }
    .controls .btn-rose { background: #f43f5e; }
    .controls .btn-rose:hover:not(:disabled) { background: #e11d48; }
    .controls select, .controls input[type="range"] {
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid #e2e8f0;
      background: white;
      font-size: 0.9rem;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: #334155;
    }
    .status {
      margin: 15px 0;
      padding: 12px 20px;
      background: #f8fafc;
      border-radius: 12px;
      font-weight: 500;
      min-height: 3em;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status .loader {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 4px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin: 5px 0;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      width: 0%;
      border-radius: 10px;
      transition: width 0.3s;
    }
    .canvas-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 15px;
    }
    .canvas-box {
      flex: 1 1 280px;
      background: repeating-conic-gradient(#e2e8f0 0% 25%, #ffffff 0% 50%) 0 0 / 20px 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      position: relative;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .canvas-box .label {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15,23,42,0.8);
      color: white;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .canvas-box canvas {
      max-width: 100%;
      max-height: 550px;
      display: block;
    }
    .info {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
    }
    .footer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
    }
    .settings-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      background: #f8fafc;
      padding: 12px 20px;
      border-radius: 12px;
      margin: 10px 0;
    }
    .settings-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: #1e293b;
    }
    .settings-group input[type="range"] {
      width: 120px;
    }
    .settings-group .value {
      min-width: 35px;
      font-weight: 600;
      color: #3b82f6;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>
    🪄 AI Studio Pro
    <small>Eliminar Fondo + Mejora de Calidad</small>
  </h1>

  <div class="grid-2">
    <div class="drop-zone" id="dropZone">
      <p>📤 Arrastra o haz clic para subir imagen</p>
      <small>JPG, PNG, WebP (máx. 15 MB)</small>
      <input type="file" id="fileInput" accept="image/*" />
    </div>
    <div style="display: flex; flex-direction: column; justify-content: center; gap: 8px;">
      <div style="font-weight: 600; color: #0f172a;">⚙️ Ajustes</div>
      <div class="settings-group">
        <label>Escala:
          <select id="scaleSelect">
            <option value="2">2x</option>
            <option value="4" selected>4x</option>
            <option value="8">8x</option>
          </select>
        </label>
        <label>Enfoque:
          <input type="range" id="sharpnessRange" min="0" max="200" value="80" />
          <span class="value" id="sharpnessValue">80%</span>
        </label>
        <label>Contraste:
          <input type="range" id="contrastRange" min="50" max="200" value="115" />
          <span class="value" id="contrastValue">115%</span>
        </label>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="removeBgBtn" disabled>🧹 Eliminar Fondo</button>
    <button id="upscaleBtn" class="btn-purple" disabled>⬆️ Mejorar Calidad</button>
    <button id="bothBtn" class="btn-success" disabled>✨ Hacer Ambos</button>
    <button id="downloadBtn" class="btn-rose" disabled>⬇️ Descargar</button>
    <button id="resetBtn">🔄 Reiniciar</button>
  </div>

  <div class="status" id="status">
    <span class="loader"></span> Cargando modelos…
  </div>
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>

  <div class="canvas-wrapper">
    <div class="canvas-box"><span class="label">📷 Original</span><canvas id="originalCanvas"></canvas></div>
    <div class="canvas-box"><span class="label">🎯 Resultado</span><canvas id="resultCanvas"></canvas></div>
  </div>

  <div class="info">
    ⚡ Modelos: <strong>BEN2-ONNX</strong> (fondo) · <strong>Mejora avanzada</strong> (Lanczos + Unsharp Mask)
  </div>
  <div class="footer">100% local · GitHub Pages · Sin subida de datos</div>
</div>

<script type="module">
  // =====================================================================
  //  IMPORTS
  // =====================================================================
  import { pipeline } from '@huggingface/transformers';

  // =====================================================================
  //  DOM REFS
  // =====================================================================
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const removeBgBtn = document.getElementById('removeBgBtn');
  const upscaleBtn = document.getElementById('upscaleBtn');
  const bothBtn = document.getElementById('bothBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statusDiv = document.getElementById('status');
  const progressFill = document.getElementById('progressFill');
  const originalCanvas = document.getElementById('originalCanvas');
  const resultCanvas = document.getElementById('resultCanvas');
  const ctxOrig = originalCanvas.getContext('2d');
  const ctxRes = resultCanvas.getContext('2d');
  const scaleSelect = document.getElementById('scaleSelect');
  const sharpnessRange = document.getElementById('sharpnessRange');
  const contrastRange = document.getElementById('contrastRange');
  const sharpnessValue = document.getElementById('sharpnessValue');
  const contrastValue = document.getElementById('contrastValue');

  // =====================================================================
  //  STATE
  // =====================================================================
  let loadedImage = null;           // HTMLImageElement
  let imageFile = null;
  let imageUrl = null;
  let segmenter = null;
  let isModelReady = false;
  let currentResultBlob = null;
  let currentStep = 'idle';
  let processing = false;

  // =====================================================================
  //  UI HELPERS
  // =====================================================================
  function setStatus(msg, isLoading = false, progress = null) {
    if (isLoading) {
      statusDiv.innerHTML = `<span class="loader"></span> ${msg}`;
    } else {
      statusDiv.textContent = msg;
    }
    if (progress !== null) {
      progressFill.style.width = `${Math.min(100, progress)}%`;
    }
  }

  function updateProgress(value) {
    progressFill.style.width = `${Math.min(100, value)}%`;
  }

  // =====================================================================
  //  LOAD MODEL (BEN2)
  // =====================================================================
  async function loadModel() {
    try {
      setStatus('📦 Descargando modelo BEN2-ONNX… (1-2 min primera vez)', true, 5);
      segmenter = await pipeline('background-removal', 'onnx-community/BEN2-ONNX');
      isModelReady = true;
      setStatus('✅ Modelo listo. Sube una imagen.', false, 100);
      if (loadedImage) enableButtons(true);
    } catch (err) {
      console.error(err);
      setStatus('❌ Error al cargar el modelo: ' + err.message, false);
    }
  }

  loadModel();

  // =====================================================================
  //  BUTTONS STATE
  // =====================================================================
  function enableButtons(enabled) {
    const btns = [removeBgBtn, upscaleBtn, bothBtn];
    btns.forEach(b => b.disabled = !enabled || !loadedImage || !isModelReady || processing);
  }

  // =====================================================================
  //  LOAD IMAGE
  // =====================================================================
  function loadImageFromFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('Selecciona una imagen (JPG, PNG, WebP).');
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      alert('La imagen es demasiado grande (máx. 15 MB).');
      return;
    }
    imageFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        if (imageUrl) URL.revokeObjectURL(imageUrl);
        imageUrl = URL.createObjectURL(file);

        originalCanvas.width = img.width;
        originalCanvas.height = img.height;
        ctxOrig.drawImage(img, 0, 0);

        resultCanvas.width = img.width;
        resultCanvas.height = img.height;
        ctxRes.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
        currentResultBlob = null;
        currentStep = 'idle';
        downloadBtn.disabled = true;
        setStatus('📷 Imagen cargada. Elige una acción.', false);
        enableButtons(true);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // =====================================================================
  //  IMAGE PROCESSING: UPSCALE + ENHANCE
  // =====================================================================
  function processImageWithEnhancement(image, scale, sharpness, contrast) {
    const w = image.width;
    const h = image.height;
    const newW = Math.round(w * scale);
    const newH = Math.round(h * scale);

    // Crear canvas temporal para el escalado
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = newW;
    tempCanvas.height = newH;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.imageSmoothingEnabled = true;
    tempCtx.imageSmoothingQuality = 'high'; // Lanczos en navegadores modernos

    // Dibujar imagen escalada
    tempCtx.drawImage(image, 0, 0, newW, newH);

    // Obtener datos de píxeles
    const imageData = tempCtx.getImageData(0, 0, newW, newH);
    const data = imageData.data;

    // Aplicar contraste
    const contrastFactor = contrast / 100;
    const brightnessOffset = 0; // Podríamos añadir brillo
    for (let i = 0; i < data.length; i += 4) {
      data[i] = Math.min(255, Math.max(0, (data[i] - 128) * contrastFactor + 128 + brightnessOffset));
      data[i+1] = Math.min(255, Math.max(0, (data[i+1] - 128) * contrastFactor + 128 + brightnessOffset));
      data[i+2] = Math.min(255, Math.max(0, (data[i+2] - 128) * contrastFactor + 128 + brightnessOffset));
    }
    tempCtx.putImageData(imageData, 0, 0);

    // Aplicar máscara de enfoque (Unsharp Mask) si sharpness > 0
    if (sharpness > 0) {
      const sharpFactor = sharpness / 100;
      // Crear una copia suavizada para el enmascaramiento
      const blurCanvas = document.createElement('canvas');
      blurCanvas.width = newW;
      blurCanvas.height = newH;
      const blurCtx = blurCanvas.getContext('2d');
      blurCtx.filter = 'blur(2px)';
      blurCtx.drawImage(tempCanvas, 0, 0);
      const blurData = blurCtx.getImageData(0, 0, newW, newH);
      const blurPixels = blurData.data;

      const sharpData = tempCtx.getImageData(0, 0, newW, newH);
      const sharpPixels = sharpData.data;

      for (let i = 0; i < sharpPixels.length; i += 4) {
        const r = sharpPixels[i];
        const g = sharpPixels[i+1];
        const b = sharpPixels[i+2];
        const br = blurPixels[i];
        const bg = blurPixels[i+1];
        const bb = blurPixels[i+2];
        sharpPixels[i] = Math.min(255, Math.max(0, r + (r - br) * sharpFactor));
        sharpPixels[i+1] = Math.min(255, Math.max(0, g + (g - bg) * sharpFactor));
        sharpPixels[i+2] = Math.min(255, Math.max(0, b + (b - bb) * sharpFactor));
      }
      tempCtx.putImageData(sharpData, 0, 0);
    }

    return tempCanvas;
  }

  // =====================================================================
  //  REMOVE BACKGROUND (BEN2)
  // =====================================================================
  async function removeBackground() {
    if (!loadedImage || !imageUrl) { setStatus('⚠️ Primero carga una imagen.'); return; }
    if (!isModelReady || !segmenter) { setStatus('⏳ Modelo no listo.'); return; }
    if (processing) return;
    processing = true;
    enableButtons(false);
    downloadBtn.disabled = true;
    setStatus('🧹 Eliminando fondo…', true, 20);

    try {
      const results = await segmenter([imageUrl]);
      const resultImg = results[0];
      const blob = await resultImg.toBlob();
      currentResultBlob = blob;
      currentStep = 'background_removed';

      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        resultCanvas.width = img.width;
        resultCanvas.height = img.height;
        ctxRes.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
        ctxRes.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        setStatus('✅ Fondo eliminado', false, 100);
        downloadBtn.disabled = false;
        processing = false;
        enableButtons(true);
      };
      img.src = url;
    } catch (err) {
      console.error(err);
      setStatus('❌ Error: ' + err.message, false);
      processing = false;
      enableButtons(true);
    }
  }

  // =====================================================================
  //  UPSCALE & ENHANCE
  // =====================================================================
  async function upscaleAndEnhance() {
    if (!loadedImage) { setStatus('⚠️ Primero carga una imagen.'); return; }
    if (processing) return;
    processing = true;
    enableButtons(false);
    downloadBtn.disabled = true;
    setStatus('⬆️ Mejorando calidad…', true, 20);

    try {
      const scale = parseFloat(scaleSelect.value);
      const sharpness = parseInt(sharpnessRange.value);
      const contrast = parseInt(contrastRange.value);

      // Usar la imagen original o la que tenga fondo eliminado?
      let sourceImage = loadedImage;
      // Si ya tenemos un resultado con fondo eliminado, usarlo como base
      if (currentStep === 'background_removed' && currentResultBlob) {
        const url = URL.createObjectURL(currentResultBlob);
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = url;
        });
        sourceImage = img;
        URL.revokeObjectURL(url);
      }

      const enhancedCanvas = processImageWithEnhancement(sourceImage, scale, sharpness, contrast);
      const blob = await new Promise(resolve => enhancedCanvas.toBlob(resolve, 'image/png'));
      currentResultBlob = blob;
      currentStep = 'upscaled';

      // Mostrar en canvas
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        resultCanvas.width = img.width;
        resultCanvas.height = img.height;
        ctxRes.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
        ctxRes.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        setStatus(`✅ Calidad mejorada (${scale}x) + enfoque ${sharpness}%`, false, 100);
        downloadBtn.disabled = false;
        processing = false;
        enableButtons(true);
      };
      img.src = url;
    } catch (err) {
      console.error(err);
      setStatus('❌ Error: ' + err.message, false);
      processing = false;
      enableButtons(true);
    }
  }

  // =====================================================================
  //  BOTH: Fondo + Mejora
  // =====================================================================
  async function bothOperations() {
    if (!loadedImage) { setStatus('⚠️ Primero carga una imagen.'); return; }
    if (processing) return;
    processing = true;
    enableButtons(false);
    downloadBtn.disabled = true;

    try {
      // Paso 1: Eliminar fondo
      setStatus('🔄 Paso 1/2: Eliminando fondo…', true, 15);
      if (!isModelReady || !segmenter) throw new Error('Modelo no listo');
      const bgResults = await segmenter([imageUrl]);
      const bgImg = bgResults[0];
      const bgBlob = await bgImg.toBlob();

      // Cargar la imagen sin fondo
      const url1 = URL.createObjectURL(bgBlob);
      const imgNoBg = await new Promise((resolve, reject) => {
        const i = new Image();
        i.onload = () => resolve(i);
        i.onerror = reject;
        i.src = url1;
      });
      URL.revokeObjectURL(url1);

      // Paso 2: Mejorar calidad
      setStatus('🔄 Paso 2/2: Mejorando calidad…', true, 50);
      const scale = parseFloat(scaleSelect.value);
      const sharpness = parseInt(sharpnessRange.value);
      const contrast = parseInt(contrastRange.value);

      const enhancedCanvas = processImageWithEnhancement(imgNoBg, scale, sharpness, contrast);
      const finalBlob = await new Promise(resolve => enhancedCanvas.toBlob(resolve, 'image/png'));
      currentResultBlob = finalBlob;
      currentStep = 'both';

      const finalUrl = URL.createObjectURL(finalBlob);
      const finalImg = new Image();
      finalImg.onload = () => {
        resultCanvas.width = finalImg.width;
        resultCanvas.height = finalImg.height;
        ctxRes.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
        ctxRes.drawImage(finalImg, 0, 0);
        URL.revokeObjectURL(finalUrl);
        setStatus(`✅ Fondo eliminado + calidad mejorada (${scale}x)`, false, 100);
        downloadBtn.disabled = false;
        processing = false;
        enableButtons(true);
      };
      finalImg.src = finalUrl;

    } catch (err) {
      console.error(err);
      setStatus('❌ Error: ' + err.message, false);
      processing = false;
      enableButtons(true);
    }
  }

  // =====================================================================
  //  DOWNLOAD
  // =====================================================================
  function downloadResult() {
    if (!currentResultBlob) { alert('No hay resultado.'); return; }
    const link = document.createElement('a');
    link.download = `resultado_${currentStep}.png`;
    link.href = URL.createObjectURL(currentResultBlob);
    link.click();
    URL.revokeObjectURL(link.href);
  }

  // =====================================================================
  //  RESET
  // =====================================================================
  function resetApp() {
    loadedImage = null;
    if (imageUrl) URL.revokeObjectURL(imageUrl);
    imageUrl = null;
    currentResultBlob = null;
    currentStep = 'idle';
    processing = false;
    ctxOrig.clearRect(0, 0, originalCanvas.width, originalCanvas.height);
    ctxRes.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
    originalCanvas.width = 0;
    originalCanvas.height = 0;
    resultCanvas.width = 0;
    resultCanvas.height = 0;
    downloadBtn.disabled = true;
    enableButtons(false);
    setStatus('🔄 Reiniciado. Sube una imagen.', false);
    fileInput.value = '';
  }

  // =====================================================================
  //  EVENTS
  // =====================================================================
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) loadImageFromFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) loadImageFromFile(e.target.files[0]);
    fileInput.value = '';
  });

  removeBgBtn.addEventListener('click', removeBackground);
  upscaleBtn.addEventListener('click', upscaleAndEnhance);
  bothBtn.addEventListener('click', bothOperations);
  downloadBtn.addEventListener('click', downloadResult);
  resetBtn.addEventListener('click', resetApp);

  // Sliders
  sharpnessRange.addEventListener('input', () => sharpnessValue.textContent = sharpnessRange.value + '%');
  contrastRange.addEventListener('input', () => contrastValue.textContent = contrastRange.value + '%');

  // =====================================================================
  //  INIT
  // =====================================================================
  setStatus('⏳ Cargando modelos…', true);
  enableButtons(false);
</script>
</body>
</html>
