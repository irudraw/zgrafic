<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Imágenes - ZGrafic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }
        
        .editor-container {
            display: flex;
            height: 100%;
            max-width: 100%;
        }
        
        /* Panel de herramientas */
        .toolbar {
            width: 250px;
            padding: 15px;
            background-color: #fff;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .tool-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        
        .tool-section-title {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        
        .tool-button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background-color: #e9ecef;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .tool-button:hover {
            background-color: #dee2e6;
        }
        
        .tool-button.active {
            background-color: #007bff;
            color: white;
        }
        
        .color-picker {
            width: 100%;
            height: 40px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .slider-container label {
            font-size: 14px;
            min-width: 60px;
        }
        
        /* Área principal del canvas */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #e9ecef;
            position: relative;
        }
        
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
        }
        
        #editorCanvas {
            background-color: #fff;
            background-image: 
                linear-gradient(45deg, #f5f5f5 25%, transparent 25%),
                linear-gradient(-45deg, #f5f5f5 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #f5f5f5 75%),
                linear-gradient(-45deg, transparent 75%, #f5f5f5 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Panel de capas */
        .layers-panel {
            width: 250px;
            padding: 15px;
            background-color: #fff;
            border-left: 1px solid #ddd;
            overflow-y: auto;
        }
        
        .layers-title {
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .layers-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .layer-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background-color: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
            z-index: 1;
            draggable: true;
        }
        
        .layer-item.active {
            background-color: #e2f0ff;
            border: 1px solid #007bff;
        }
        
        .layer-item:hover {
            background-color: #e9ecef;
        }
        
        .layer-item.dragging {
            background-color: #e2f0ff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            opacity: 0.8;
        }
        
        .layer-thumbnail {
            width: 40px;
            height: 40px;
            background-color: #ddd;
            margin-right: 10px;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .layer-controls {
            margin-left: auto;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .layer-item:hover .layer-controls {
            opacity: 1;
        }
        
        .layer-control {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 12px;
        }
        
        .layer-control:hover {
            color: #007bff;
        }
        
        /* Entrada de texto */
        .text-input-container {
            position: absolute;
            display: none;
            z-index: 100;
        }
        
        #textInput {
            padding: 8px;
            border: 2px solid #007bff;
            border-radius: 4px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            min-width: 200px;
        }
        
        /* Botones de acción */
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 15px;
            background-color: #fff;
            border-top: 1px solid #ddd;
        }
        
        .action-button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .save-button {
            background-color: #28a745;
            color: white;
        }
        
        .save-button:hover {
            background-color: #218838;
        }
        
        .cancel-button {
            background-color: #dc3545;
            color: white;
        }
        
        .cancel-button:hover {
            background-color: #c82333;
        }
        
        .download-button {
            background-color: #17a2b8;
            color: white;
        }
        
        .download-button:hover {
            background-color: #138496;
        }
        
        .add-layer-button {
            background: none;
            border: none;
            color: #007bff;
            cursor: pointer;
            font-size: 20px;
        }
        
        /* Controles de redimensionamiento */
        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #007bff;
            border: 1px solid white;
            border-radius: 50%;
            z-index: 100;
            pointer-events: auto;
        }
        
        .resize-nw { cursor: nw-resize; }
        .resize-n { cursor: n-resize; }
        .resize-ne { cursor: ne-resize; }
        .resize-e { cursor: e-resize; }
        .resize-se { cursor: se-resize; }
        .resize-s { cursor: s-resize; }
        .resize-sw { cursor: sw-resize; }
        .resize-w { cursor: w-resize; }
        
        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <!-- Panel de herramientas -->
        <div class="toolbar">
            <div class="tool-section">
                <span class="tool-section-title">Herramientas</span>
                <button id="selectTool" class="tool-button"><i class="fas fa-mouse-pointer"></i> Seleccionar</button>
                <button id="drawTool" class="tool-button active"><i class="fas fa-pencil-alt"></i> Dibujar</button>
                <button id="textTool" class="tool-button"><i class="fas fa-font"></i> Texto</button>
                <button id="eraserTool" class="tool-button"><i class="fas fa-eraser"></i> Borrador</button>
                <button id="shapeTool" class="tool-button"><i class="fas fa-square"></i> Formas</button>
            </div>
            
            <div class="tool-section">
                <span class="tool-section-title">Color</span>
                <input type="color" id="colorPicker" class="color-picker" value="#000000">
                <div class="slider-container">
                    <label for="brushOpacity">Opacidad:</label>
                    <input type="range" id="brushOpacity" min="1" max="100" value="100">
                    <span id="brushOpacityValue">100%</span>
                </div>
            </div>
            
            <div class="tool-section">
                <span class="tool-section-title">Pincel</span>
                <div class="slider-container">
                    <label for="brushSize">Tamaño:</label>
                    <input type="range" id="brushSize" min="1" max="50" value="5">
                    <span id="brushSizeValue">5</span>
                </div>
            </div>
            
            <div class="tool-section">
                <span class="tool-section-title">Texto</span>
                <div class="slider-container">
                    <label for="textSize">Tamaño:</label>
                    <input type="range" id="textSize" min="10" max="72" value="24">
                    <span id="textSizeValue">24</span>
                </div>
                <select id="textFont" class="tool-button" style="width: 100%; margin-top: 5px;">
                    <option value="Arial">Arial</option>
                    <option value="Poppins" selected>Poppins</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Courier New">Courier New</option>
                </select>
            </div>
            
            <div class="tool-section">
                <span class="tool-section-title">Acciones</span>
                <button id="clearTool" class="tool-button"><i class="fas fa-trash-alt"></i> Limpiar capa</button>
                <button id="addLayerTool" class="tool-button"><i class="fas fa-layer-plus"></i> Nueva capa</button>
            </div>
        </div>
        
        <!-- Área principal -->
        <div class="canvas-area">
            <div class="canvas-container">
                <canvas id="editorCanvas"></canvas>
                <div class="text-input-container">
                    <input type="text" id="textInput" placeholder="Escribe tu texto...">
                </div>
            </div>
            
            <div class="action-buttons">
                <button id="cancelButton" class="action-button cancel-button"><i class="fas fa-times"></i> Cancelar</button>
                <button id="downloadButton" class="action-button download-button"><i class="fas fa-download"></i> Descargar</button>
                <button id="saveButton" class="action-button save-button"><i class="fas fa-save"></i> Guardar</button>
            </div>
        </div>
        
        <!-- Panel de capas -->
        <div class="layers-panel">
            <div class="layers-title">
                <span>Capas</span>
                <button id="addLayerBtn" class="add-layer-button" title="Añadir capa">+</button>
            </div>
            <div class="layers-list" id="layersList">
                <!-- Las capas se añadirán aquí dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elementos del DOM
            const canvas = document.getElementById('editorCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const layersList = document.getElementById('layersList');
            
            // Variables de estado
            let isDrawing = false;
            let isMoving = false;
            let isResizing = false;
            let currentTool = 'draw';
            let currentLayerIndex = 0;
            let layers = [];
            let lastX = 0;
            let lastY = 0;
            let textPosition = { x: 0, y: 0 };
            let selectedItem = null;
            let selectionStart = { x: 0, y: 0 };
            let offset = { x: 0, y: 0 };
            let draggedLayer = null;
            let resizeDirection = '';
            let resizeStartX = 0;
            let resizeStartY = 0;
            let originalSize = 0;
            let originalWidth = 0;
            let originalHeight = 0;
            let originalX = 0;
            let originalY = 0;
            let currentPath = [];
            let selectedItemInitialState = null;
            
            // Configuración inicial
            const defaultCanvasWidth = 800;
            const defaultCanvasHeight = 600;
            
            // Clase para representar una capa
            class Layer {
                constructor(width, height) {
                    this.canvas = document.createElement('canvas');
                    this.canvas.width = width;
                    this.canvas.height = height;
                    this.ctx = this.canvas.getContext('2d');
                    this.visible = true;
                    this.name = `Capa ${layers.length + 1}`;
                    this.id = Date.now() + Math.random().toString(36).substr(2, 9);
                    this.draggableItems = [];
                    this.opacity = 1;
                    this.activeTextItem = null;
                    this.isBackground = false;
                }
                
                clear() {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    if (!this.isBackground) {
                        this.draggableItems = [];
                    }
                    this.activeTextItem = null;
                }
            }
            
            // Función para renderizar todas las capas
            function renderLayers() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Dibujar todas las capas visibles
                layers.forEach(layer => {
                    if (layer.visible) {
                        ctx.globalAlpha = layer.opacity;
                        ctx.drawImage(layer.canvas, 0, 0);
                        ctx.globalAlpha = 1;
                    }
                });
                
                updateLayersList();
                
                // Mostrar controles de escala si hay un elemento seleccionado
                if (selectedItem) {
                    showResizeHandles(selectedItem);
                }
            }
            
            // Función para mostrar controles de redimensionamiento
            function showResizeHandles(item) {
                // Eliminar controles existentes
                document.querySelectorAll('.resize-handle').forEach(el => el.remove());
                
                if (!item) return;
                
                const canvasRect = canvas.getBoundingClientRect();
                const canvasLeft = canvasRect.left + window.scrollX;
                const canvasTop = canvasRect.top + window.scrollY;
                
                let x, y, width, height;
                
                if (item.type === 'path') {
                    // Calcular el bounding box del trazo
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    item.points.forEach(point => {
                        minX = Math.min(minX, point.x);
                        minY = Math.min(minY, point.y);
                        maxX = Math.max(maxX, point.x);
                        maxY = Math.max(maxY, point.y);
                    });
                    
                    x = minX - 5;
                    y = minY - 5;
                    width = (maxX - minX) + 10;
                    height = (maxY - minY) + 10;
                } else if (item.type === 'text') {
                    const textWidth = measureTextWidth(item.text, `${item.size}px ${item.font}`);
                    const textHeight = parseInt(item.size);
                    
                    x = item.x - 5;
                    y = item.y - textHeight - 5;
                    width = textWidth + 10;
                    height = textHeight + 10;
                }
                
                // Crear 8 puntos de control (como Photoshop)
                const positions = [
                    { pos: 'nw', left: canvasLeft + x, top: canvasTop + y },
                    { pos: 'n', left: canvasLeft + x + width/2 - 5, top: canvasTop + y },
                    { pos: 'ne', left: canvasLeft + x + width - 10, top: canvasTop + y },
                    { pos: 'e', left: canvasLeft + x + width - 10, top: canvasTop + y + height/2 - 5 },
                    { pos: 'se', left: canvasLeft + x + width - 10, top: canvasTop + y + height - 10 },
                    { pos: 's', left: canvasLeft + x + width/2 - 5, top: canvasTop + y + height - 10 },
                    { pos: 'sw', left: canvasLeft + x, top: canvasTop + y + height - 10 },
                    { pos: 'w', left: canvasLeft + x, top: canvasTop + y + height/2 - 5 }
                ];
                
                positions.forEach(pos => {
                    const handle = document.createElement('div');
                    handle.className = `resize-handle resize-${pos.pos}`;
                    handle.style.position = 'absolute';
                    handle.style.left = `${pos.left}px`;
                    handle.style.top = `${pos.top}px`;
                    handle.style.width = '10px';
                    handle.style.height = '10px';
                    handle.style.backgroundColor = '#007bff';
                    handle.style.border = '1px solid white';
                    handle.style.borderRadius = '50%';
                    handle.style.cursor = `${pos.pos}-resize`;
                    handle.style.zIndex = '100';
                    handle.dataset.direction = pos.pos;
                    handle.dataset.itemId = item.id;
                    
                    handle.addEventListener('mousedown', startResize);
                    document.body.appendChild(handle);
                });
            }
            
            // Función para iniciar el redimensionamiento
            function startResize(e) {
                e.stopPropagation();
                const direction = e.target.dataset.direction;
                const itemId = e.target.dataset.itemId;
                
                const currentLayer = getCurrentLayer();
                const item = currentLayer.draggableItems.find(i => i.id === itemId);
                
                if (!item) return;
                
                selectedItem = item;
                isResizing = true;
                resizeDirection = direction;
                resizeStartX = e.clientX;
                resizeStartY = e.clientY;
                
                // Guardar el estado inicial del objeto
                selectedItemInitialState = JSON.parse(JSON.stringify(item));
                
                document.addEventListener('mousemove', resizeItem);
                document.addEventListener('mouseup', stopResize);
            }
            
            // Función para redimensionar el elemento
            function resizeItem(e) {
                if (!isResizing || !selectedItem) return;
                
                const dx = e.clientX - resizeStartX;
                const dy = e.clientY - resizeStartY;
                
                // Calcular factores de escala
                let scaleX = 1, scaleY = 1;
                
                if (resizeDirection.includes('e')) {
                    scaleX = 1 + dx / selectedItemInitialState.width;
                } else if (resizeDirection.includes('w')) {
                    scaleX = 1 - dx / selectedItemInitialState.width;
                }
                
                if (resizeDirection.includes('s')) {
                    scaleY = 1 + dy / selectedItemInitialState.height;
                } else if (resizeDirection.includes('n')) {
                    scaleY = 1 - dy / selectedItemInitialState.height;
                }
                
                // Aplicar transformación según el tipo de objeto
                if (selectedItem.type === 'path') {
                    // Escalar cada punto del trazo
                    const centerX = selectedItemInitialState.x + selectedItemInitialState.width / 2;
                    const centerY = selectedItemInitialState.y + selectedItemInitialState.height / 2;
                    
                    selectedItem.points = selectedItemInitialState.points.map(point => {
                        return {
                            x: centerX + (point.x - centerX) * scaleX,
                            y: centerY + (point.y - centerY) * scaleY
                        };
                    });
                } else if (selectedItem.type === 'text') {
                    // Escalar el texto
                    selectedItem.size = Math.max(8, selectedItemInitialState.size * (resizeDirection.includes('n') || resizeDirection.includes('s') ? scaleY : scaleX);
                    
                    // Reposicionar si es necesario
                    if (resizeDirection.includes('n')) {
                        selectedItem.y = selectedItemInitialState.y + (selectedItemInitialState.height - parseInt(selectedItem.size));
                    }
                    
                    if (resizeDirection.includes('w')) {
                        const textWidth = measureTextWidth(selectedItem.text, `${selectedItem.size}px ${selectedItem.font}`);
                        selectedItem.x = selectedItemInitialState.x + (selectedItemInitialState.width - textWidth);
                    }
                }
                
                // Redibujar la capa
                redrawLayerWithItems(getCurrentLayer());
                renderLayers();
            }
            
            function stopResize() {
                isResizing = false;
                document.removeEventListener('mousemove', resizeItem);
                document.removeEventListener('mouseup', stopResize);
            }
            
            // Función para medir el ancho del texto
            function measureTextWidth(text, font) {
                const span = document.createElement('span');
                span.style.font = font;
                span.style.whiteSpace = 'nowrap';
                span.style.position = 'absolute';
                span.style.left = '-9999px';
                span.textContent = text;
                document.body.appendChild(span);
                const width = span.offsetWidth;
                document.body.removeChild(span);
                return width;
            }
            
            // Función para actualizar la lista de capas en el panel
            function updateLayersList() {
                layersList.innerHTML = '';
                
                layers.forEach((layer, index) => {
                    const layerItem = document.createElement('div');
                    layerItem.className = `layer-item ${index === currentLayerIndex ? 'active' : ''}`;
                    layerItem.dataset.id = layer.id;
                    layerItem.draggable = true;
                    layerItem.innerHTML = `
                        <div class="layer-thumbnail">
                            <canvas width="40" height="40" id="thumb-${layer.id}"></canvas>
                        </div>
                        <span>${layer.name}</span>
                        <div class="layer-controls">
                            <button class="layer-control move-up" data-id="${layer.id}" title="Mover arriba"><i class="fas fa-arrow-up"></i></button>
                            <button class="layer-control move-down" data-id="${layer.id}" title="Mover abajo"><i class="fas fa-arrow-down"></i></button>
                            <button class="layer-control delete-layer" data-id="${layer.id}" title="Eliminar capa"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    
                    layerItem.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('layer-control')) {
                            currentLayerIndex = index;
                            selectedItem = null;
                            renderLayers();
                        }
                    });
                    
                    layersList.appendChild(layerItem);
                    
                    // Actualizar miniatura
                    const thumbCanvas = document.getElementById(`thumb-${layer.id}`);
                    const thumbCtx = thumbCanvas.getContext('2d');
                    
                    // Escalar la miniatura
                    const scale = Math.min(
                        40 / layer.canvas.width,
                        40 / layer.canvas.height
                    );
                    const thumbWidth = layer.canvas.width * scale;
                    const thumbHeight = layer.canvas.height * scale;
                    
                    thumbCtx.clearRect(0, 0, 40, 40);
                    thumbCtx.drawImage(
                        layer.canvas,
                        0, 0, layer.canvas.width, layer.canvas.height,
                        (40 - thumbWidth) / 2, (40 - thumbHeight) / 2, thumbWidth, thumbHeight
                    );
                });
                
                // Agregar eventos a los controles de capa
                document.querySelectorAll('.move-up').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        moveLayerUp(btn.dataset.id);
                    });
                });
                
                document.querySelectorAll('.move-down').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        moveLayerDown(btn.dataset.id);
                    });
                });
                
                document.querySelectorAll('.delete-layer').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteLayer(btn.dataset.id);
                    });
                });
            }
            
            // Función para mover una capa hacia arriba
            function moveLayerUp(layerId) {
                const index = layers.findIndex(l => l.id === layerId);
                if (index > 0) {
                    const layer = layers[index];
                    layers.splice(index, 1);
                    layers.splice(index - 1, 0, layer);
                    
                    if (currentLayerIndex === index) {
                        currentLayerIndex = index - 1;
                    } else if (currentLayerIndex === index - 1) {
                        currentLayerIndex = index;
                    }
                    
                    renderLayers();
                }
            }
            
            // Función para mover una capa hacia abajo
            function moveLayerDown(layerId) {
                const index = layers.findIndex(l => l.id === layerId);
                if (index < layers.length - 1) {
                    const layer = layers[index];
                    layers.splice(index, 1);
                    layers.splice(index + 1, 0, layer);
                    
                    if (currentLayerIndex === index) {
                        currentLayerIndex = index + 1;
                    } else if (currentLayerIndex === index + 1) {
                        currentLayerIndex = index;
                    }
                    
                    renderLayers();
                }
            }
            
            // Función para eliminar una capa
            function deleteLayer(layerId) {
                if (layers.length <= 1) {
                    alert('Debe haber al menos una capa');
                    return;
                }
                
                const index = layers.findIndex(l => l.id === layerId);
                if (index !== -1) {
                    // No permitir eliminar la capa de fondo si es la única
                    if (layers[index].isBackground && layers.filter(l => l.isBackground).length === 1) {
                        alert('No puedes eliminar la capa de fondo principal');
                        return;
                    }
                    
                    layers.splice(index, 1);
                    
                    if (currentLayerIndex >= index) {
                        currentLayerIndex = Math.max(0, currentLayerIndex - 1);
                    }
                    
                    selectedItem = null;
                    renderLayers();
                }
            }
            
            // Función para añadir una nueva capa
            function addNewLayer() {
                const newLayer = new Layer(canvas.width, canvas.height);
                layers.push(newLayer);
                currentLayerIndex = layers.length - 1;
                selectedItem = null;
                renderLayers();
            }
            
            // Función para obtener la capa actual
            function getCurrentLayer() {
                return layers[currentLayerIndex];
            }
            
            // Configurar arrastre de capas
            function setupLayerDragAndDrop() {
                layersList.addEventListener('dragstart', function(e) {
                    if (e.target.classList.contains('layer-item')) {
                        draggedLayer = e.target;
                        e.dataTransfer.setData('text/plain', draggedLayer.dataset.id);
                        e.target.classList.add('dragging');
                    }
                });
                
                layersList.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(layersList, e.clientY);
                    const draggingItem = document.querySelector('.layer-item.dragging');
                    
                    if (draggingItem) {
                        if (afterElement == null) {
                            layersList.appendChild(draggingItem);
                        } else {
                            layersList.insertBefore(draggingItem, afterElement);
                        }
                    }
                });
                
                layersList.addEventListener('dragend', function(e) {
                    if (draggedLayer) {
                        draggedLayer.classList.remove('dragging');
                        
                        // Actualizar el orden de las capas
                        const newLayers = [];
                        document.querySelectorAll('.layer-item').forEach(item => {
                            const layer = layers.find(l => l.id === item.dataset.id);
                            if (layer) newLayers.push(layer);
                        });
                        
                        layers = newLayers;
                        currentLayerIndex = layers.findIndex(l => l.id === draggedLayer.dataset.id);
                        draggedLayer = null;
                        renderLayers();
                    }
                });
                
                function getDragAfterElement(container, y) {
                    const draggableElements = [...container.querySelectorAll('.layer-item:not(.dragging)')];
                    
                    return draggableElements.reduce((closest, child) => {
                        const box = child.getBoundingClientRect();
                        const offset = y - box.top - box.height / 2;
                        
                        if (offset < 0 && offset > closest.offset) {
                            return { offset: offset, element: child };
                        } else {
                            return closest;
                        }
                    }, { offset: Number.NEGATIVE_INFINITY }).element;
                }
            }
            
            // Función para obtener un elemento en una posición específica
            function getItemAtPosition(x, y) {
                const currentLayer = getCurrentLayer();
                
                // Buscar en orden inverso (los últimos dibujados están encima)
                for (let i = currentLayer.draggableItems.length - 1; i >= 0; i--) {
                    const item = currentLayer.draggableItems[i];
                    
                    if (item.type === 'path') {
                        // Verificar si el punto está dentro del bounding box del trazo
                        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                        item.points.forEach(point => {
                            minX = Math.min(minX, point.x);
                            minY = Math.min(minY, point.y);
                            maxX = Math.max(maxX, point.x);
                            maxY = Math.max(maxY, point.y);
                        });
                        
                        if (x >= minX - 10 && x <= maxX + 10 && y >= minY - 10 && y <= maxY + 10) {
                            // Calcular el bounding box para el estado inicial
                            item.x = minX;
                            item.y = minY;
                            item.width = maxX - minX;
                            item.height = maxY - minY;
                            return item;
                        }
                    } else if (item.type === 'text') {
                        const textWidth = measureTextWidth(item.text, `${item.size}px ${item.font}`);
                        const textHeight = parseInt(item.size);
                        
                        if (x >= item.x && x <= item.x + textWidth &&
                            y >= item.y - textHeight && y <= item.y) {
                            // Calcular el bounding box para el estado inicial
                            item.width = textWidth;
                            item.height = textHeight;
                            return item;
                        }
                    }
                }
                
                return null;
            }
            
            // Función para redibujar una capa con sus elementos
            function redrawLayerWithItems(layer) {
                layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
                
                // Si es la capa de fondo, no limpiar los draggableItems
                if (layer.isBackground) {
                    layer.ctx.drawImage(layer.canvas, 0, 0);
                    return;
                }
                
                layer.draggableItems.forEach(item => {
                    layer.ctx.save();
                    layer.ctx.globalAlpha = item.opacity || 1;
                    
                    if (item.type === 'path') {
                        layer.ctx.strokeStyle = item.color;
                        layer.ctx.lineWidth = item.width;
                        layer.ctx.lineCap = 'round';
                        layer.ctx.lineJoin = 'round';
                        layer.ctx.beginPath();
                        
                        if (item.points.length > 0) {
                            layer.ctx.moveTo(item.points[0].x, item.points[0].y);
                            for (let i = 1; i < item.points.length; i++) {
                                layer.ctx.lineTo(item.points[i].x, item.points[i].y);
                            }
                            layer.ctx.stroke();
                        }
                    } else if (item.type === 'text') {
                        layer.ctx.font = `${item.size}px ${item.font}`;
                        layer.ctx.fillStyle = item.color;
                        layer.ctx.fillText(item.text, item.x, item.y);
                    }
                    
                    layer.ctx.restore();
                });
            }
            
            // Inicializar capas
            function initLayers() {
                layers = [];
                const baseLayer = new Layer(canvas.width, canvas.height);
                baseLayer.isBackground = true;
                layers.push(baseLayer); // Capa base de fondo
                addNewLayer(); // Capa para dibujar
            }
            
            // Cargar imagen desde URL
            const urlParams = new URLSearchParams(window.location.search);
            const imageUrl = urlParams.get('image');
            
            if (imageUrl) {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    initLayers();
                    
                    // Dibujar la imagen en la capa base de fondo
                    const baseLayer = layers[0];
                    baseLayer.ctx.drawImage(img, 0, 0);
                    
                    renderLayers();
                    setupLayerDragAndDrop();
                };
                img.src = imageUrl;
            } else {
                canvas.width = defaultCanvasWidth;
                canvas.height = defaultCanvasHeight;
                initLayers();
                renderLayers();
                setupLayerDragAndDrop();
            }
            
            // Configurar herramientas
            const colorPicker = document.getElementById('colorPicker');
            const brushSize = document.getElementById('brushSize');
            const brushSizeValue = document.getElementById('brushSizeValue');
            const brushOpacity = document.getElementById('brushOpacity');
            const brushOpacityValue = document.getElementById('brushOpacityValue');
            const textSize = document.getElementById('textSize');
            const textSizeValue = document.getElementById('textSizeValue');
            const textFont = document.getElementById('textFont');
            const selectTool = document.getElementById('selectTool');
            const drawTool = document.getElementById('drawTool');
            const textTool = document.getElementById('textTool');
            const eraserTool = document.getElementById('eraserTool');
            const shapeTool = document.getElementById('shapeTool');
            const clearTool = document.getElementById('clearTool');
            const addLayerTool = document.getElementById('addLayerTool');
            const textInputContainer = document.querySelector('.text-input-container');
            const textInput = document.getElementById('textInput');
            const saveButton = document.getElementById('saveButton');
            const cancelButton = document.getElementById('cancelButton');
            const downloadButton = document.getElementById('downloadButton');
            const addLayerBtn = document.getElementById('addLayerBtn');
            
            // Eventos del mouse
            function startDrawing(e) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                if (currentTool === 'select') {
                    // Verificar si se hizo clic en un elemento dibujado
                    selectedItem = getItemAtPosition(mouseX, mouseY);
                    if (selectedItem) {
                        isMoving = true;
                        selectionStart = { x: mouseX, y: mouseY };
                        
                        // Calcular el offset basado en la posición del click
                        if (selectedItem.type === 'path') {
                            // Usar el centro del bounding box para el offset
                            offset = {
                                x: mouseX - (selectedItem.x + selectedItem.width / 2),
                                y: mouseY - (selectedItem.y + selectedItem.height / 2)
                            };
                        } else if (selectedItem.type === 'text') {
                            offset = {
                                x: mouseX - selectedItem.x,
                                y: mouseY - selectedItem.y
                            };
                        }
                        
                        // Mostrar controles de redimensionamiento
                        showResizeHandles(selectedItem);
                        return;
                    } else {
                        selectedItem = null;
                        document.querySelectorAll('.resize-handle').forEach(el => el.remove());
                    }
                }
                
                if (currentTool === 'draw' || currentTool === 'eraser') {
                    isDrawing = true;
                    lastX = mouseX;
                    lastY = mouseY;
                    
                    // Iniciar un nuevo trazo
                    currentPath = [{x: mouseX, y: mouseY}];
                    
                    const layerCtx = getCurrentLayer().ctx;
                    layerCtx.beginPath();
                    layerCtx.moveTo(mouseX, mouseY);
                    
                    if (currentTool === 'draw') {
                        layerCtx.strokeStyle = colorPicker.value;
                        layerCtx.lineWidth = brushSize.value;
                        layerCtx.globalAlpha = brushOpacity.value / 100;
                        layerCtx.lineCap = 'round';
                        layerCtx.lineJoin = 'round';
                    } else if (currentTool === 'eraser') {
                        layerCtx.strokeStyle = '#ffffff';
                        layerCtx.lineWidth = brushSize.value;
                        layerCtx.globalAlpha = 1;
                        layerCtx.lineCap = 'round';
                        layerCtx.lineJoin = 'round';
                    }
                }
            }
            
            function draw(e) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                if (isMoving && selectedItem) {
                    // Mover el elemento seleccionado
                    const dx = mouseX - selectionStart.x;
                    const dy = mouseY - selectionStart.y;
                    
                    if (selectedItem.type === 'path') {
                        // Mover todos los puntos del trazo
                        for (let i = 0; i < selectedItem.points.length; i++) {
                            selectedItem.points[i].x += dx;
                            selectedItem.points[i].y += dy;
                        }
                        // Actualizar la posición del bounding box
                        selectedItem.x += dx;
                        selectedItem.y += dy;
                    } else if (selectedItem.type === 'text') {
                        selectedItem.x += dx;
                        selectedItem.y += dy;
                    }
                    
                    selectionStart = { x: mouseX, y: mouseY };
                    
                    // Redibujar la capa
                    redrawLayerWithItems(getCurrentLayer());
                    renderLayers();
                    return;
                }
                
                if (!isDrawing) return;
                
                const layerCtx = getCurrentLayer().ctx;
                
                if (currentTool === 'draw' || currentTool === 'eraser') {
                    layerCtx.lineTo(mouseX, mouseY);
                    layerCtx.stroke();
                    
                    // Agregar punto al trazo actual
                    currentPath.push({x: mouseX, y: mouseY});
                }
                
                [lastX, lastY] = [mouseX, mouseY];
            }
            
            function stopDrawing() {
                if (isDrawing) {
                    isDrawing = false;
                    getCurrentLayer().ctx.closePath();
                    
                    // Guardar el trazo completo como un solo elemento
                    if (currentPath.length > 1) {
                        getCurrentLayer().draggableItems.push({
                            type: 'path',
                            id: Date.now().toString(),
                            points: [...currentPath],
                            color: currentTool === 'draw' ? colorPicker.value : '#ffffff',
                            width: brushSize.value,
                            opacity: currentTool === 'draw' ? brushOpacity.value / 100 : 1
                        });
                    }
                    
                    currentPath = [];
                    renderLayers();
                }
                
                if (isMoving) {
                    isMoving = false;
                }
            }
            
            function handleCanvasClick(e) {
                if (currentTool === 'text') {
                    const rect = canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    
                    // Verificar si se hizo clic en texto existente
                    const clickedItem = getItemAtPosition(mouseX, mouseY);
                    
                    if (clickedItem && clickedItem.type === 'text') {
                        // Editar texto existente
                        const currentLayer = getCurrentLayer();
                        
                        // Eliminar el texto antiguo de la lista de elementos
                        const index = currentLayer.draggableItems.findIndex(item => 
                            item.type === 'text' && item.id === clickedItem.id);
                        
                        if (index !== -1) {
                            currentLayer.draggableItems.splice(index, 1);
                        }
                        
                        // Limpiar y redibujar la capa sin el texto antiguo
                        redrawLayerWithItems(currentLayer);
                        renderLayers();
                        
                        // Configurar para edición
                        textPosition = { 
                            x: clickedItem.x, 
                            y: clickedItem.y 
                        };
                        
                        textInputContainer.style.display = 'block';
                        textInputContainer.style.left = `${clickedItem.x + rect.left}px`;
                        textInputContainer.style.top = `${clickedItem.y - parseFloat(clickedItem.size) + rect.top}px`;
                        textInput.value = clickedItem.text;
                        textInput.focus();
                        
                        // Seleccionar el texto para edición fácil
                        textInput.select();
                        return;
                    }
                    
                    // Crear nuevo texto
                    textPosition = { 
                        x: mouseX, 
                        y: mouseY 
                    };
                    
                    textInputContainer.style.display = 'block';
                    textInputContainer.style.left = `${e.pageX}px`;
                    textInputContainer.style.top = `${e.pageY}px`;
                    textInput.value = '';
                    textInput.focus();
                }
            }
            
            function handleTextInput(e) {
                if (e.key === 'Enter') {
                    const layer = getCurrentLayer();
                    const text = textInput.value;
                    
                    if (text.trim()) {
                        layer.ctx.font = `${textSize.value}px ${textFont.value}`;
                        layer.ctx.fillStyle = colorPicker.value;
                        layer.ctx.globalAlpha = brushOpacity.value / 100;
                        layer.ctx.fillText(text, textPosition.x, textPosition.y);
                        
                        // Guardar el texto como elemento movible
                        layer.draggableItems.push({
                            type: 'text',
                            id: Date.now().toString(),
                            text: text,
                            x: textPosition.x,
                            y: textPosition.y,
                            color: colorPicker.value,
                            size: textSize.value,
                            font: textFont.value,
                            opacity: brushOpacity.value / 100
                        });
                    }
                    
                    textInput.value = '';
                    textInputContainer.style.display = 'none';
                    renderLayers();
                }
            }
            
            function clearCurrentLayer() {
                if (confirm('¿Estás seguro de que quieres limpiar la capa actual?')) {
                    getCurrentLayer().clear();
                    selectedItem = null;
                    renderLayers();
                }
            }
            
            function updateBrushSize() {
                brushSizeValue.textContent = brushSize.value;
            }
            
            function updateBrushOpacity() {
                brushOpacityValue.textContent = `${brushOpacity.value}%`;
            }
            
            function updateTextSize() {
                textSizeValue.textContent = textSize.value;
            }
            
            function saveImage() {
                // Aquí puedes implementar la lógica para guardar la imagen en el servidor
                alert('Función de guardar implementada en el servidor');
            }
            
            function cancelEditing() {
                if (confirm('¿Estás seguro de que quieres salir sin guardar los cambios?')) {
                    window.close(); // Cierra la ventana/pestaña
                }
            }
            
            function downloadImage() {
                const link = document.createElement('a');
                link.download = 'imagen-editada.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }
            
            // Configurar eventos
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            canvas.addEventListener('click', handleCanvasClick);
            
            brushSize.addEventListener('input', updateBrushSize);
            brushOpacity.addEventListener('input', updateBrushOpacity);
            textSize.addEventListener('input', updateTextSize);
            
            selectTool.addEventListener('click', () => setActiveTool('select'));
            drawTool.addEventListener('click', () => setActiveTool('draw'));
            textTool.addEventListener('click', () => setActiveTool('text'));
            eraserTool.addEventListener('click', () => setActiveTool('eraser'));
            shapeTool.addEventListener('click', () => setActiveTool('shape'));
            clearTool.addEventListener('click', clearCurrentLayer);
            addLayerTool.addEventListener('click', addNewLayer);
            addLayerBtn.addEventListener('click', addNewLayer);
            
            textInput.addEventListener('keypress', handleTextInput);
            
            saveButton.addEventListener('click', saveImage);
            cancelButton.addEventListener('click', cancelEditing);
            downloadButton.addEventListener('click', downloadImage);
            
            function setActiveTool(tool) {
                currentTool = tool;
                
                // Actualizar botones activos
                selectTool.classList.remove('active');
                drawTool.classList.remove('active');
                textTool.classList.remove('active');
                eraserTool.classList.remove('active');
                shapeTool.classList.remove('active');
                
                if (tool === 'select') {
                    selectTool.classList.add('active');
                    canvas.style.cursor = 'move';
                } else if (tool === 'draw') {
                    drawTool.classList.add('active');
                    canvas.style.cursor = 'crosshair';
                } else if (tool === 'text') {
                    textTool.classList.add('active');
                    canvas.style.cursor = 'text';
                } else if (tool === 'eraser') {
                    eraserTool.classList.add('active');
                    canvas.style.cursor = 'crosshair';
                } else if (tool === 'shape') {
                    shapeTool.classList.add('active');
                    canvas.style.cursor = 'crosshair';
                }
                
                selectedItem = null;
                document.querySelectorAll('.resize-handle').forEach(el => el.remove());
            }
            
            // Inicializar valores
            updateBrushSize();
            updateBrushOpacity();
            updateTextSize();
            setActiveTool('draw');
        });
    </script>
